<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>B.C Tracker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <strong>B.C Tracker</strong>
    <a id="open-tracker" class="tracker-link" href="http://localhost:5055" target="_blank" rel="noopener">Open tracker ↗</a>
    <span id="app-status" class="status-dot" title="Local app status"></span>
  </header>

  <section class="block">
    <button id="fill-btn" class="btn">Fill this page</button>
    <p id="fill-summary" class="hint"></p>
    <ul id="flag-list" class="flag-list"></ul>
    <p id="verify-heading" class="hint" hidden>B.C Tracker filled these, then flagged a problem — please double-check:</p>
    <ul id="verify-list" class="flag-list verify-list"></ul>
    <p id="check-heading" class="hint" hidden>Worth a second look:</p>
    <ul id="check-list" class="flag-list check-list"></ul>
  </section>

  <hr />

  <section class="block">
    <h2>Log this application</h2>
    <p class="hint" id="context-hint"></p>
    <p class="hint missing-hint" id="missing-hint" role="status" hidden></p>
    <form id="log-form">
      <label>Company <input name="company" required /></label>
      <label>Role / Program <input name="role" required /></label>
      <label>Industry <input name="industry" /></label>
      <label>Region <input name="region" /></label>
      <label>Status
        <select name="status">
          <option>Bookmarked</option>
          <option>Applying</option>
          <option selected>Applied</option>
          <option>Interviewing</option>
          <option>Offer</option>
          <option>Rejected</option>
        </select>
      </label>
      <label>Date applied <input type="date" name="dateApplied" /></label>
      <label>Deadline <input type="date" name="deadline" /></label>
      <label>CV version used
        <select name="cvVersionUsed" id="cv-version-select">
          <option value="">—</option>
        </select>
      </label>
      <label>Notes <textarea name="notes" rows="2"></textarea></label>
      <button type="submit" class="btn">Log application</button>
      <p id="log-msg" class="hint"></p>
    </form>
  </section>

  <script src="popup.js"></script>
</body>
</html>
